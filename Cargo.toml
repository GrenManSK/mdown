[package]
name = "mdown"
version = "0.16.0"
edition = "2021"
authors = ["GrenManSK <melnicek.richard@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/GrenManSK/mdown"
readme = "README.md"
description = "Mdown is a Rust-based manga downloader for Mangadex, featuring a CLI, GUI, and web interface. It supports configurable downloads, concurrent fetching, database management, and an integrated manga reader."
keywords = ["mangadex", "manga", "downloader"]

build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
bytefmt = "0.1.7"
bytes = "1.11.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
crosscurses = { version = "0.1.0", features = ["win32"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5.1", optional = true }
eframe = { version = "0.33.3", optional = true }
egui = { version = "0.33.3", optional = true }
futures = "0.3.31"
gif = { version = "0.14.1", optional = true }
glob = "0.3.3"
if-addrs = { version = "0.14.0", optional = true }
image = { version = "0.25.9", optional = true }
lazy_static = "1.5.0"
parking_lot = "0.12.5"
percent-encoding = { version = "2.3.2", optional = true }
rand = "0.9.2"
regex = "1.12.2"
remove_dir_all = "1.0.0"
reqwest = { version = "0.13.1", features = ["json"] }
# rodio will be left on 0.20.1; reason change in api
rodio = { version = "0.20.1", optional = true }
rusqlite = { version = "0.38.0", features = ["bundled"] }
ryu = "1.0.22"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
smallvec = "1.15.1"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = "1.19.0"
walkdir = "2.5.0"
webbrowser = { version = "1.0.6", optional = true }
# zip will be left on 0.6.6 reason see here https://github.com/GrenManSK/mdown/commit/89ab31464d638b9ec2af318bcd0a5356bc94ed2d
zip = "0.6.6"


[build-dependencies]
winres = "0.1.12"

[features]
default = ["web", "server"]
min = []
full = ["web", "gui", "server", "music"]
music = ["rodio"]
web = ["webbrowser", "ctrlc", "percent-encoding"]
server = ["webbrowser", "if-addrs", "percent-encoding", "ctrlc"]
gui = ["eframe", "egui", "gif", "image"]
